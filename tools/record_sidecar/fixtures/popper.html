<!doctype html>
<html><head><meta charset="utf-8"><title>Popper</title>
<style>
body{margin:0;background:red;color:#fff;font:32px sans-serif;padding:40px}
.bar{height:40px;width:300px;background:#fff;animation:slide 2s linear infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(600px)}}
a,button{display:block;color:#fff;font:28px sans-serif;margin:12px 0}
</style></head>
<body><h1>Popper</h1><div class="bar"></div>
<a id="blank" href="b.html" target="_blank">open blank</a>
<a id="noopener" href="b.html" target="_blank" rel="noopener">open noopener</a>
<button id="js" onclick="window.open('b.html')">open js</button>
<button id="feat" onclick="window.open('b.html','','width=500,height=400')">open window</button>
<a id="xo" target="_blank">open xorigin</a>
<a id="self" href="selfclose.html" target="_blank">open selfclose</a>
<a id="chain" href="chain.html" target="_blank">open chain</a>
<button id="blocked" onclick="setTimeout(()=>window.open('b.html'),6000)">open late</button>
<script>
// Cross-origin popup: same fixture server, different origin (localhost vs 127.0.0.1).
document.getElementById('xo').href = 'http://localhost:' + location.port + '/c.html';
</script>
</body></html>
