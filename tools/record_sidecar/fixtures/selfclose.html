<!doctype html>
<html><head><meta charset="utf-8"><title>Selfclose</title>
<style>
body{margin:0;background:#0040ff;color:#fff;font:32px sans-serif;padding:40px}
.bar{height:40px;width:300px;background:#fff;animation:slide 2s linear infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(600px)}}
</style></head>
<body><h1>Selfclose</h1><div class="bar"></div>
<script>
// ?ms=N sets how long the popup stays before it closes itself (default 2500 ms).
setTimeout(() => window.close(), Number(new URLSearchParams(location.search).get('ms') || 2500));
</script>
</body></html>
