<!doctype html>
<html><head><meta charset="utf-8"><title>Mark</title>
<style>
body{margin:0;background:red;color:#fff;font:32px sans-serif;padding:40px}
.bar{height:40px;width:300px;background:#fff;animation:slide 2s linear infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(600px)}}
button{font:28px sans-serif;margin:10px 20px 10px 0;padding:10px 20px}
</style></head>
<body><h1>Mark</h1><div class="bar"></div>
<button id="blue" onclick="document.body.style.background='#0040ff'">turn blue</button>
<button id="green" onclick="document.body.style.background='#00a000'">turn green</button>
</body></html>
